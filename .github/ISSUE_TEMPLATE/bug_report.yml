name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this project. Do not include passwords, API keys, tokens, private data, or sensitive medical information.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest reproducible example or exact steps using non-sensitive data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python/TensorFlow version, runtime, OS, or notebook environment.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs or screenshots are welcome after removing sensitive values.
